server.port=8000

# File upload limits (student submissions & assignment templates)
# Without these, Spring's default 1MB cap resets the connection on larger files.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Let Tomcat read the full body instead of resetting the connection when the limit is hit.
server.tomcat.max-swallow-size=60MB

# DataSource Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/actionlearning}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
# Keep this on 'update' for normal development (your data persists across restarts).
# NOTE: 'update' cannot retrofit new NOT NULL columns onto tables that already
# contain rows. After a breaking model change (e.g. the Cohort/Programme/Semester/
# Course restructure), run db/reset_database.sql once to drop the schema, then start
# the app ? 'update' recreates everything cleanly and DemoDataSeeder reseeds.
# Full procedure: see DATABASE_SETUP.md at the repo root.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail Configuration (SendGrid Web API - HTTP based)
sendgrid.api.key=${SENDGRID_API_KEY:your-api-key-here}
app.mail.from=acl.support27@gmail.com

# AI Service Configuration (NLP Engine)
ai.service.url=${AI_SERVICE_URL:https://actionlearningai-production.up.railway.app}

# JWT Configuration
# Replace jwt.secret with: openssl rand -base64 32
jwt.secret=eW91ci1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==
jwt.expiration-ms=86400000

# Payment microservice events (Kafka)
# payment-service publishes PAYMENT_COMPLETED / PAYMENT_FAILED on the "payment-events" topic;
# this app consumes them to notify the student. Off by default so deployments without a
# Kafka broker (e.g. Railway) are unaffected. Locally: `docker compose up -d`, then run with
# PAYMENTS_KAFKA_ENABLED=true. See payment-service/README.md.
payments.kafka.enabled=${PAYMENTS_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Consumer group: Kafka tracks how far THIS app has read. Any other service subscribing
# with its own group id gets its own independent copy of every event.
spring.kafka.consumer.group-id=academic-core
# A brand-new group starts from the oldest retained event instead of only new ones.
spring.kafka.consumer.auto-offset-reset=earliest