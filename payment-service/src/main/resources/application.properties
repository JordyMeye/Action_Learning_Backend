server.port=8081
spring.application.name=payment-service

# ---------------------------------------------------------------------------
# Database — this service owns its OWN database ("database per service").
# The core backend never reads these tables; it only learns about payments
# through the events published on Kafka.
# ---------------------------------------------------------------------------
spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:5433/payments}
spring.datasource.username=${PAYMENT_DB_USERNAME:payment}
spring.datasource.password=${PAYMENT_DB_PASSWORD:payment}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# RabbitMQ — work queue for ProcessPayment commands
# ---------------------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:payment}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:payment}

# Competing consumers: 2-4 worker threads share the queue; prefetch=1 means a
# worker only takes a new payment once it has finished the current one.
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=1

# A transient failure (provider timeout) is retried 4 times with exponential
# backoff: 2s, 4s, 8s. After that the message is rejected WITHOUT requeue, so
# RabbitMQ routes it to the dead-letter queue instead of looping forever.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Publisher confirms + returns: the outbox relay only marks a message as sent
# once RabbitMQ has confirmed it was stored and routed to a queue.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# ---------------------------------------------------------------------------
# Kafka — event log for PAYMENT_COMPLETED / PAYMENT_FAILED
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# acks=all: the write is only acknowledged once every in-sync replica has it.
spring.kafka.producer.acks=all
# Idempotent producer: the broker drops duplicates caused by producer retries.
spring.kafka.producer.properties.enable.idempotence=true
# Fail fast (instead of the 60s default) when the broker is down; the outbox retries later.
spring.kafka.producer.properties.max.block.ms=5000

# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
# How often the outbox relay looks for messages to hand to RabbitMQ / Kafka.
payment.outbox.poll-interval-ms=1000
# Simulated round-trip to the payment provider.
payment.gateway.latency-ms=1500

# Must be the SAME secret as the core backend, so tokens it issues are accepted here.
jwt.secret=${JWT_SECRET:eW91ci1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==}
