# Local infrastructure for the payment microservice.
#
#   docker compose up -d                 -> payments Postgres, RabbitMQ, Kafka, Kafka UI
#   docker compose --profile app up -d   -> the above + payment-service built from ./payment-service
#
#   RabbitMQ UI : http://localhost:15672   (payment / payment)
#   Kafka UI    : http://localhost:8090
#
# The core backend keeps using its own Postgres on 5432; the payment service has a
# separate database on 5433 (database per service).

services:
  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5433:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: payment
      RABBITMQ_DEFAULT_PASS: payment
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Two listeners: HOST for apps on your machine (localhost:9092),
  # DOCKER for containers on the compose network (kafka:29092).
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  payment-service:
    profiles: ["app"]
    build: ./payment-service
    ports:
      - "8081:8081"
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/payments
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - payment-db
      - rabbitmq
      - kafka
    restart: on-failure

volumes:
  payment-db-data:
